		================================================================ */
		function initials(name) {
			return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
		}

		function scrollToContact() {
			document.getElementById('contact').scrollIntoView({
				behavior: 'smooth'
			});
		}

		/* ================================================================
		   RENDER
		================================================================ */
		function render() {
			const C = CONFIG;

			// Avatar
			const img = document.getElementById('avatar-img');
			const fallback = document.getElementById('avatar-fallback');
			img.alt = C.name;
			if (C.avatar) {
				img.src = C.avatar;
			} else {
				// img.style.display = 'none';
				// fallback.style.display = 'flex';
				// fallback.textContent = initials(C.name);
			}

			// Hero
			document.getElementById('cfg-name').textContent = C.name;
			document.getElementById('cfg-title').textContent = C.title;
			document.getElementById('cfg-subtitle').textContent = C.subtitle;
			document.getElementById('cfg-cta-primary').textContent = C.ctaPrimary;

			// Final CTA
			document.getElementById('cfg-cta-link').href = C.ctaLink;
			document.getElementById('cfg-cta-secondary').textContent = C.ctaSecondary;

			// Trust items
			const trustList = document.getElementById('trust-list');
			trustList.innerHTML = C.trustItems.map(item => `
    <div class="trust-item">
      <div class="trust-icon">${ICONS[item.icon] || ICONS.check}</div>
      <span>${item.text}</span>
    </div>
  `).join('');

			// Benefits
			const benefitsList = document.getElementById('benefits-list');
			benefitsList.innerHTML = C.benefits.map((b, i) => `
    <div class="card benefit-card" style="animation-delay:${i * 0.1}s">
      <div class="benefit-icon">${ICONS[b.icon] || ICONS.zap}</div>
      <h3>${b.title}</h3>
      <p>${b.text}</p>
    </div>
  `).join('');

			// Footer links
			document.getElementById('cfg-telegram-link').href = C.telegramLink || '#';
			const instaEl = document.getElementById('cfg-instagram-link');
			if (C.instagramLink) {
				instaEl.href = C.instagramLink;
				instaEl.style.display = 'flex';
			}
			document.getElementById('cfg-phone-link').href = C.phoneLink || '#';

			// Brand
			const brandLink = document.getElementById('cfg-brand-link');
			brandLink.textContent = C.brandName;
			brandLink.href = C.brandLink;

			// Scroll-triggered animations
			const observer = new IntersectionObserver((entries) => {
				entries.forEach(entry => {
					if (entry.isIntersecting) {
						entry.target.classList.add('visible');
						observer.unobserve(entry.target);
					}
				});
			}, {
				threshold: 0.1
			});

			document.querySelectorAll('.card, .contact-box').forEach(el => observer.observe(el));
		}

		document.addEventListener('DOMContentLoaded', render);
	</script>
</body>

</html>
