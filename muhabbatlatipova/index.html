	<script>
		/* ================================================================
		   SVG ICON LIBRARY (inline, no dependencies)
		================================================================ */
		const ICONS = {
			zap: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
			users: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
			trending: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
			heart: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
			award: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>`,
			shield: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>`
		};

		/* ================================================================
		   RENDER
		================================================================ */
		function initials(name) {
			return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
		}

		function render() {
			const C = CONFIG;

			// Avatar
			const img = document.getElementById('avatar-img');
			const fallback = document.getElementById('avatar-fallback');
			img.alt = C.name;
			if (C.avatar) {
				img.src = C.avatar;
			} else {
				// img.style.display = 'none';
				// fallback.style.display = 'flex';
				// fallback.textContent = initials(C.name);
			}

			// Hero
			document.getElementById('cfg-name').textContent = C.name;
			document.getElementById('cfg-title').textContent = C.title;
			document.getElementById('cfg-headline').textContent = C.headline;

			const ctaLink = document.getElementById('cfg-cta-link');
			const ctaLink2 = document.getElementById('cfg-cta-link-2');
			const ctaText = document.getElementById('cfg-cta-text');
			const ctaText2 = document.getElementById('cfg-cta-text-2');
			ctaLink.href = C.ctaLink;
			ctaLink2.href = C.ctaLink;
			ctaText.textContent = C.ctaText;
			ctaText2.textContent = C.ctaText;

			// Stats
			document.getElementById('cfg-stat1-num').textContent = C.stats.stat1.num;
			document.getElementById('cfg-stat1-label').textContent = C.stats.stat1.label;
			document.getElementById('cfg-stat2-num').textContent = C.stats.stat2.num;
			document.getElementById('cfg-stat2-label').textContent = C.stats.stat2.label;
			document.getElementById('cfg-stat3-num').textContent = C.stats.stat3.num;
			document.getElementById('cfg-stat3-label').textContent = C.stats.stat3.label;

			// Values
			const valuesList = document.getElementById('values-list');
			valuesList.innerHTML = C.values.map((v, i) => `
				<div class="value-card" style="animation-delay:${i * 0.1}s">
					<div class="value-icon-wrap">${ICONS[v.icon] || ICONS.zap}</div>
					<div>
					<h3>${v.title}</h3>
					<p>${v.desc}</p>
					</div>
				</div>
			`).join('');

			// Testimonial
			document.getElementById('cfg-testimonial-text').textContent = `"${C.testimonial.text}"`;
			document.getElementById('cfg-testimonial-author').textContent = C.testimonial.author;
			document.getElementById('cfg-testimonial-role').textContent = C.testimonial.role;

			// Footer links
			/*
			document.getElementById('cfg-telegram-link').href = C.telegramLink || '#';
			const instaEl = document.getElementById('cfg-instagram-link');
			if (C.instagramLink) {
				instaEl.href = C.instagramLink;
				instaEl.style.display = 'flex';
			}
			document.getElementById('cfg-phone-link').href = C.phoneLink || '#';
			*/

			// Brand
			const brandLink = document.getElementById('cfg-brand-link');
			brandLink.textContent = C.brandName;
			brandLink.href = C.brandLink;

			// Scroll-triggered animation for value cards
			const observer = new IntersectionObserver((entries) => {
				entries.forEach(entry => {
					if (entry.isIntersecting) {
						entry.target.classList.add('visible');
						observer.unobserve(entry.target);
					}
				});
			}, {
				threshold: 0.15
			});

			document.querySelectorAll('.value-card').forEach(el => observer.observe(el));
		}

		document.addEventListener('DOMContentLoaded', render);
	</script>
